name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history (the commit metadata is checked too)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Claude Code CLI (used only for claude plugin validate)
        run: npm install --global @anthropic-ai/claude-code@2.1.317
        env:
          DISABLE_AUTOUPDATER: "1"

      - name: Run scripts/check_repo.sh
        run: bash scripts/check_repo.sh
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
